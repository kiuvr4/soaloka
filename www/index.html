<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Kiora. Dreamy Space</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&display=swap');

    :root {
      --bg-gradient: linear-gradient(160deg, #fff0f6 0%, #f3f0ff 50%, #e7f5ff 100%);
      --card-bg: rgba(255, 255, 255, 0.78);
      --pink-soft: #ffafcc;
      --pink-deep: #fb6f92;
      --lavender: #cdb4db;
      --text-main: #5e548e;
      --text-soft: #9f86c0;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Quicksand', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      min-height: 100vh;
      background: var(--bg-gradient);
      color: var(--text-main);
      padding: 28px 20px 40px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .cloud-header {
      text-align: center;
      margin-bottom: 24px;
    }

    .badge {
      display: inline-block;
      background: #ffffff;
      color: var(--pink-deep);
      padding: 6px 14px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
      box-shadow: 0 4px 12px rgba(251, 111, 146, 0.12);
      margin-bottom: 8px;
    }

    h1 {
      font-size: 26px;
      font-weight: 700;
      letter-spacing: -0.3px;
    }

    p.subtitle {
      font-size: 14px;
      color: var(--text-soft);
      margin-top: 4px;
    }

    .card {
      width: 100%;
      max-width: 420px;
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      border: 1.5px solid rgba(255, 255, 255, 0.9);
      border-radius: 26px;
      padding: 20px;
      margin-bottom: 18px;
      box-shadow: 0 10px 28px rgba(159, 134, 192, 0.12);
    }

    .card-title {
      font-size: 15px;
      font-weight: 700;
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .mood-row {
      display: flex;
      justify-content: space-between;
      gap: 8px;
    }

    .mood-btn {
      flex: 1;
      background: #ffffff;
      border: 2px solid transparent;
      border-radius: 18px;
      padding: 12px 6px;
      font-size: 22px;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.03);
    }

    .mood-btn.active {
      border-color: var(--pink-soft);
      background: #fff5f8;
      transform: translateY(-3px);
    }

    .input-group {
      display: flex;
      gap: 8px;
      margin-bottom: 14px;
    }

    input[type="text"] {
      flex: 1;
      border: 1.5px solid #f3d5e5;
      background: #ffffff;
      border-radius: 16px;
      padding: 12px 14px;
      font-size: 14px;
      color: var(--text-main);
      outline: none;
    }

    input[type="text"]:focus {
      border-color: var(--pink-soft);
    }

    button.add-btn {
      background: linear-gradient(135deg, #ffafcc, #cdb4db);
      color: #ffffff;
      border: none;
      border-radius: 16px;
      padding: 0 18px;
      font-weight: 700;
      font-size: 14px;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(205, 180, 219, 0.4);
    }

    ul.task-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    li.task-item {
      background: #ffffff;
      padding: 12px 14px;
      border-radius: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 14px;
      font-weight: 600;
      box-shadow: 0 3px 10px rgba(94, 84, 142, 0.05);
      transition: 0.2s;
    }

    li.task-item.done span {
      text-decoration: line-through;
      color: var(--text-soft);
    }

    .del-btn {
      background: #fff0f5;
      color: var(--pink-deep);
      border: none;
      border-radius: 10px;
      padding: 4px 10px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="cloud-header">
    <div class="badge">☁️ cozy corner</div>
    <h1>Kiora. ✨</h1>
    <p class="subtitle">catatan kecil & suasana hatimu hari ini</p>
  </div>

  <div class="card">
    <div class="card-title">🌷 Bagaimana perasaanmu sekarang?</div>
    <div class="mood-row">
      <button class="mood-btn" onclick="selectMood(this, '✨')">✨</button>
      <button class="mood-btn" onclick="selectMood(this, '🧸')">🧸</button>
      <button class="mood-btn" onclick="selectMood(this, '🍓')">🍓</button>
      <button class="mood-btn" onclick="selectMood(this, '☁️')">☁️</button>
      <button class="mood-btn" onclick="selectMood(this, '🌙')">🌙</button>
    </div>
  </div>

  <div class="card">
    <div class="card-title">🎀 Daftar Rencana Imut</div>
    <div class="input-group">
      <input type="text" id="taskInput" placeholder="Tulis hal manis yang mau dilakukan..." />
      <button class="add-btn" onclick="addTask()">Tambah</button>
    </div>
    <ul class="task-list" id="taskList"></ul>
  </div>

  <script>
    let tasks = JSON.parse(localStorage.getItem('kiora_tasks')) || [
      { text: 'Minum air putih & stretching sebentar 🌷', done: false },
      { text: 'Baca buku favorit 15 menit 📖', done: false }
    ];

    function renderTasks() {
      const list = document.getElementById('taskList');
      list.innerHTML = '';
      tasks.forEach((task, index) => {
        const li = document.createElement('li');
        li.className = 'task-item' + (task.done ? ' done' : '');
        li.innerHTML = `
          <span onclick="toggleTask(${index})">${task.done ? '💖' : '🤍'} ${task.text}</span>
          <button class="del-btn" onclick="deleteTask(${index})">Hapus</button>
        `;
        list.appendChild(li);
      });
      localStorage.setItem('kiora_tasks', JSON.stringify(tasks));
    }

    function addTask() {
      const input = document.getElementById('taskInput');
      if (!input.value.trim()) return;
      tasks.unshift({ text: input.value.trim(), done: false });
      input.value = '';
      renderTasks();
    }

    function toggleTask(index) {
      tasks[index].done = !tasks[index].done;
      renderTasks();
    }

    function deleteTask(index) {
      tasks.splice(index, 1);
      renderTasks();
    }

    function selectMood(btn, emoji) {
      document.querySelectorAll('.mood-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      localStorage.setItem('kiora_mood', emoji);
    }

    renderTasks();
  </script>
</body>
</html>
